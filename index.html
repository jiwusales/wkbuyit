<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>吉物敗家小幫手</title>
<link rel="icon" href="https://i.postimg.cc/3R7nNT0k/icon.png" type="image/png">
<style>
:root{--theme:#D9C0FA;--active:#8A6FA8;--text:#333}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f9f9f9;margin:0;color:var(--text);text-align:center;overflow-x:hidden}
.top-bar{position:fixed;top:0;left:0;width:100%;height:40px;background:var(--theme);color:#fff;z-index:999;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold}
.header-fixed{position:fixed;top:40px;width:100%;background:#fff;z-index:998;border-bottom:1px solid #eee}
.page-tabs-wrapper,.nav-bar-wrapper,.filter-bar-wrapper{display:flex;align-items:center;padding:0 5px}
.page-tabs-wrapper{height:40px;border-bottom:1px solid #eee}.nav-bar-wrapper{height:38px;border-bottom:1px solid #eee}.filter-bar-wrapper{height:30px}
.scroll-container{flex:1;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.scroll-container::-webkit-scrollbar{display:none}
.page-tabs{display:inline-flex;gap:5px;padding:4px 0}.page-tab{border:0;background:#f3f3f3;color:#666;padding:7px 12px;border-radius:8px;font-size:12px;white-space:nowrap;cursor:pointer}.page-tab.active{background:var(--theme);color:#fff;font-weight:bold}
.nav-bar{display:inline-block;padding:8px 0;font-size:10pt}.nav-bar a{color:var(--text);text-decoration:none;padding:6px 0;display:inline-block;cursor:pointer}
.nav-bar a.active-role,.filter-item.active{font-weight:bold;color:var(--active)}.nav-bar a::after{content:"｜";color:#aaa;margin:0 2px}.nav-bar a:last-child::after{content:""}
.filter-item{display:inline-flex;align-items:center;margin:0 4px;font-size:12px;color:#666}.filter-item input{margin-right:3px;accent-color:var(--theme);transform:scale(.8)}
.nav-arrow{width:24px;font-size:16px;cursor:pointer;flex-shrink:0;color:#bbb}
#card-container{padding:158px 10px 10px}.type-divider{display:flex;align-items:center;justify-content:center;margin:15px 0 8px;font-weight:bold;font-size:16px}
.type-divider::before,.type-divider::after{content:"";flex:1;border-top:1px solid #ddd;margin:0 10px}
.group-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}@media(min-width:480px){.group-grid{grid-template-columns:repeat(auto-fill,120px)}}
.card{border:2px solid var(--theme);border-radius:8px;background:#fff;text-align:center;cursor:pointer;overflow:hidden;position:relative}
.add-btn-tag{position:absolute;top:4px;right:4px;width:18px;height:18px;border-radius:50%;background:var(--theme);color:#fff;font-size:14px;font-weight:bold;display:flex;align-items:center;justify-content:center;z-index:10}
.stock-warning{position:absolute;top:3px;left:4px;font-size:15px;line-height:18px;z-index:10}
.ordered-tag{position:absolute;top:3px;left:5px;color:#E24C60;font-size:18px;font-weight:bold;line-height:1;z-index:10}
.soldout-tag{position:absolute;top:3px;left:4px;font-size:15px;line-height:1;z-index:10}
.card img{height:90px;width:auto;max-width:90%;display:block;margin:5px auto 0;object-fit:contain;pointer-events:none}
.card .buyer{margin:2px 2px 0;font-size:9px;font-weight:bold;line-height:1.2;color:#989FC0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .name{margin:1px 2px;font-size:9px;font-weight:bold;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .price{font-size:10px;margin:1px auto 5px;color:#F68450}
.product-link{display:inline-block;margin:0 auto 5px;padding:3px 8px;border:1px solid var(--theme);border-radius:6px;color:var(--active);font-size:9px;text-decoration:none;background:#fff}
.card-overlay{position:fixed;inset:0;background:#000b;z-index:10000;display:flex;justify-content:center;align-items:center}.card-overlay .card{transform:scale(3.1);width:100px;padding:15px 0 5px;pointer-events:none}
#cart-overlay-bg{position:fixed;inset:0;background:#0006;display:none;z-index:1000}
#cart-trigger{position:fixed;top:155px;right:15px;width:45px;height:45px;background:#fff;border-radius:50%;display:flex;justify-content:center;align-items:center;box-shadow:0 2px 8px #0003;z-index:999;opacity:.85;cursor:move;touch-action:none}
#cart-trigger img{width:28px;height:28px;pointer-events:none}#cart-badge{position:absolute;top:-2px;right:-2px;background:#ff4d4f;color:#fff;font-size:10px;border-radius:50%;width:18px;height:18px;display:none;align-items:center;justify-content:center;font-weight:bold}
#cart-panel{position:fixed;top:0;right:-300px;width:280px;height:100%;background:#fff;box-shadow:-5px 0 15px #0002;z-index:1001;transition:.3s;display:flex;flex-direction:column}#cart-panel.open{right:0}
.cart-header{padding:12px 15px;background:var(--theme);color:#fff;font-weight:bold;font-size:16px;text-align:left;display:flex;justify-content:space-between}
.cart-list{flex:1;overflow-y:auto;padding:10px;text-align:left}.cart-item{display:flex;align-items:center;gap:10px;margin-bottom:10px;border-bottom:1px solid #eee;padding-bottom:8px;font-size:12px}
.cart-item img{width:45px;height:45px;object-fit:contain}.cart-item-info{flex:1;min-width:0}.cart-footer{padding:15px 15px 25px;border-top:1px solid #eee;background:#fafafa}
.shipping-box{font-size:12px;text-align:left;background:#fff;border:1px solid #eee;border-radius:7px;padding:8px;margin-bottom:10px;line-height:1.8}
.text-clear{display:block;text-align:left;color:#aaa;font-size:13px;text-decoration:underline;cursor:pointer;margin-bottom:10px}
.btn-checkout{background:var(--theme);color:#fff;border:0;padding:12px;width:100%;border-radius:8px;cursor:pointer;font-weight:bold;font-size:14px}
#checkout-modal{position:fixed;inset:0;background:#000c;z-index:2000;display:none;align-items:center;justify-content:center}.modal-content{background:#fff;width:85%;max-width:380px;border-radius:15px;padding:20px;position:relative}
.summary-box{background:#f9f9f9;padding:10px;border-radius:5px;font-size:12px;max-height:280px;overflow-y:auto;text-align:left;margin-bottom:10px;border:1px solid #eee}
body.latest-tab .nav-bar-wrapper{height:auto;min-height:38px;padding:4px 10px}
body.latest-tab .nav-bar-wrapper .nav-arrow{display:none}
body.latest-tab #role-scroll{overflow:visible;white-space:normal}
body.latest-tab .nav-bar{display:flex;flex-wrap:wrap;justify-content:center;padding:0;white-space:normal}
body.latest-tab .nav-bar a{padding:5px 3px}
</style>
</head>
<body>

<div class="top-bar">吉物敗家小幫手</div>

<div class="header-fixed">
<div class="page-tabs-wrapper"><div class="nav-arrow" onclick="tabScroll.scrollBy(-180,0)">❮</div><div class="scroll-container" id="tab-scroll"><div class="page-tabs" id="page-tabs"></div></div><div class="nav-arrow" onclick="tabScroll.scrollBy(180,0)">❯</div></div>
<div class="nav-bar-wrapper"><div class="nav-arrow" onclick="roleScroll.scrollBy(-150,0)">❮</div><div class="scroll-container" id="role-scroll"><div class="nav-bar" id="dynamic-nav"></div></div><div class="nav-arrow" onclick="roleScroll.scrollBy(150,0)">❯</div></div>
<div class="filter-bar-wrapper"><div class="nav-arrow" onclick="filterScroll.scrollBy(-150,0)">❮</div><div class="scroll-container" id="filter-scroll"><div id="filter-bar"></div></div><div class="nav-arrow" onclick="filterScroll.scrollBy(150,0)">❯</div></div>
</div>

<div id="card-container"><div id="items-wrapper"></div></div>

<div id="cart-trigger"><img src="https://images.icon-icons.com/2098/PNG/512/shopping_cart_icon_128753.png"><div id="cart-badge">0</div></div>
<div id="cart-overlay-bg" onclick="toggleCart(false)"></div>

<div id="cart-panel">
<div class="cart-header"><span>購物車</span><span style="cursor:pointer;font-size:20px" onclick="toggleCart(false)">✕</span></div>
<div class="cart-list" id="cart-list"></div>
<div class="cart-footer"><span class="text-clear" onclick="clearCart()">清空購物車</span><div id="shipping-progress" class="shipping-box"></div><div style="margin-bottom:12px;font-weight:bold;display:flex;justify-content:space-between"><span>原價合計</span><span id="cart-total">¥0</span></div><button class="btn-checkout" onclick="openCheckoutModal()">確認訂購</button></div>
</div>

<div id="checkout-modal"><div class="modal-content">
<span onclick="closeModal()" style="position:absolute;top:10px;right:15px;cursor:pointer;color:#ccc">✕</span>
<h3 style="margin-top:0">確認訂購</h3>
<div class="summary-box" id="modal-summary-list"></div>
<div id="modal-shipping" class="shipping-box"></div>
<div style="text-align:right;font-weight:bold;margin-bottom:10px">原價合計：<span id="modal-total-price">¥0</span></div>
<button class="btn-checkout" id="send-btn" onclick="handleFinalCheckout()">確認訂購</button>
</div></div>

<script>
const SHEET_ID="10Q4EOGZPMsu9WOyabxZjU8j6QNuGduM8L-h_mZ10ypQ",FREE_SHIPPING=11000,IMG="https://i.postimg.cc/bv5xRs04/image.png";
const ORDER_API="https://script.google.com/macros/s/AKfycbz2MEC8O7cjxRLb3xQMGnOLlzfoPc8E_-PDnXjb8sCFph1oLvBAnY30y6OyzcA8iSVt/exec";
const SITES={chiikawa:"https://chiikawamarket.jp",nagano:"https://nagano-market.jp",mogu:"https://chiikawamogumogu.shop"},ALLOWED=Object.values(SITES);
const MAIN_GROUPS=["ナガノ","ちいかわ","人魚島","ちいかわ樂園"];
const HIDE_ROLES=["其他角色","綜合角色","全角色","三小隻","水族","食物","動物"];
const TABS={pending:{label:"待訂購區",sheet:"線上銷售"},latest:{label:"開團待訂區",sheet:"線上銷售"},reminder:{label:"尚未訂購提醒區",sheet:"線上銷售"},chiikawa:{label:"ちいかわ",sheet:"商品庫存"},nagano:{label:"ナガノ",sheet:"商品庫存"},mogu:{label:"もぐもぐ本舖",sheet:"商品庫存"}};

let currentTab="pending",allItems=[],allCategories=[],allTypes=[],selectedTypes=[],selectedRole=null,orderedCounts={},soldOutCounts={},cart=JSON.parse(localStorage.getItem("jiwu_helper_cart")||"[]"),sheetCache={};
const tabScroll=document.getElementById("tab-scroll"),roleScroll=document.getElementById("role-scroll"),filterScroll=document.getElementById("filter-scroll");

function col(a,...n){for(const x of n){const i=a.indexOf(x);if(i>=0)return i}return-1}
function getV(r,i){if(i<0||!r.c||!r.c[i])return"";const c=r.c[i];return String(c.v??c.f??"").trim()}
function originOf(u){try{return new URL(u).origin}catch{return""}}
function siteName(o){return o===SITES.chiikawa?"ちいかわ":o===SITES.nagano?"ナガノ":o===SITES.mogu?"もぐもぐ本舖":o||"未知官網"}
function yen(v){const n=Number(String(v||"").replace(/[^\d.-]/g,""));return Number.isFinite(n)?n:0}
function fmt(n){return Math.round(n).toLocaleString("ja-JP")}
function priceText(v){return yen(v)?`¥${fmt(yen(v))}`:"無原價資料"}
function buyerText(i){return`${i.source?`(${i.source})`:""}${i.customer||""}`}
function norm(v){return String(v||"").replace(/\s+/g,"").trim()}
function productText(i){const n=String(i.name||"").trim(),r=String(i.role||"").trim();return!r||HIDE_ROLES.includes(r)||norm(n).includes(norm(r))?n:`${n} ${r}`}

function renderTabs(){
document.getElementById("page-tabs").innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="page-tab ${currentTab===k?"active":""}" onclick="switchTab('${k}')">${v.label}</button>`).join("");
}

async function getSheet(sheet){
if(sheetCache[sheet])return sheetCache[sheet];
const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheet)}&headers=1`;
const t=await fetch(url).then(r=>r.text()),data=JSON.parse(t.substr(47).slice(0,-2)),L=(data.table.cols||[]).map(c=>String(c.label||"").trim());
const C={ip:col(L,"IP"),role:col(L,"角色"),type:col(L,"種類"),name:col(L,"名稱"),originalPrice:col(L,"原價"),stock:col(L,"庫存"),sn:col(L,"貨號"),img:col(L,"圖片","首圖"),url:col(L,"商品網址","網址"),status:col(L,"狀態"),group:col(L,"團名"),source:col(L,"來源"),customer:col(L,"顧客名稱","購買人","訂購人")};
return sheetCache[sheet]=data.table.rows.map(r=>({ip:getV(r,C.ip),role:getV(r,C.role),type:getV(r,C.type),name:getV(r,C.name),originalPrice:getV(r,C.originalPrice),colStock:getV(r,C.stock),sn:getV(r,C.sn),img:getV(r,C.img),url:getV(r,C.url),status:getV(r,C.status),group:getV(r,C.group),source:getV(r,C.source),customer:getV(r,C.customer)}));
}

async function loadOrderedCounts(){
const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent("已訂購清單")}&headers=1`;
const t=await fetch(url).then(r=>r.text()),d=JSON.parse(t.substr(47).slice(0,-2));
const L=(d.table.cols||[]).map(c=>String(c.label||"").trim());
const T=col(L,"時間"),S=col(L,"貨號"),N=col(L,"名稱"),Q=col(L,"數量"),O=col(L,"缺貨"),rows=d.table.rows||[];

let latest="";
rows.forEach(r=>{const x=getV(r,T);if(x)latest=x});

const ok={},bad={};
rows.forEach(r=>{
if(getV(r,T)!==latest)return;
const sn=getV(r,S),name=getV(r,N),key=sn?`S:${norm(sn)}`:`N:${norm(name)}`;
ok[key]=(ok[key]||0)+(Number(getV(r,Q))||0);
bad[key]=(bad[key]||0)+(Number(getV(r,O))||0);
});
orderedCounts=ok;
soldOutCounts=bad;
}

function findStock(item,stock){
const sn=norm(item.sn);
if(sn){const s=stock.find(x=>norm(x.sn)===sn);if(s)return s}
const name=norm(item.name),role=norm(item.role),full=norm(`${item.name}${item.role}`);
return stock.find(x=>(norm(x.name)===name&&norm(x.role)===role)||norm(`${x.name}${x.role}`)===full||norm(`${x.role}${x.name}`)===full)||null;
}

function mergeStock(item,stock){
const s=findStock(item,stock);
return{...item,ip:item.ip||s?.ip||"",role:item.role||s?.role||"",type:item.type||s?.type||"",img:s?.img||item.img,url:item.url||s?.url||"",sn:item.sn||s?.sn||"",originalPrice:s?.originalPrice||""};
}

function mergeLatestPrice(item,latest){
const s=findStock(item,latest);
return{...item,img:s?.img||item.img,originalPrice:s?.originalPrice||item.originalPrice||""};
}

function filterNormal(rows,key){
const ok=i=>["0","1"].includes(i.colStock);
if(key==="chiikawa")return rows.filter(i=>i.name&&ok(i)&&["ちいかわ","ちいかわ樂園"].includes(i.ip)&&originOf(i.url)===SITES.chiikawa);
if(key==="nagano")return rows.filter(i=>i.name&&ok(i)&&i.ip==="ナガノ"&&originOf(i.url)===SITES.nagano);
return rows.filter(i=>i.name&&ok(i)&&i.ip==="ちいかわ"&&originOf(i.url)===SITES.mogu);
}

async function switchTab(key){
currentTab=key;selectedTypes=[];selectedRole=null;
document.body.classList.toggle("latest-tab",key==="latest"||key==="reminder");
renderTabs();

document.querySelector(".nav-bar-wrapper").style.display="flex";
document.querySelector(".filter-bar-wrapper").style.display=["pending","latest","reminder"].includes(key)?"none":"flex";
document.getElementById("items-wrapper").innerHTML="<div style='padding:40px;color:#999'>載入中...</div>";

try{
let rows=await getSheet(TABS[key].sheet),stock;
await loadOrderedCounts();

if(key==="pending"){
stock=await getSheet("商品庫存");
rows=rows.filter(i=>i.name&&i.status==="未訂購"&&MAIN_GROUPS.includes(i.group)).map(i=>mergeStock(i,stock)).filter(i=>ALLOWED.includes(originOf(i.url)));
}else if(key==="latest"||key==="reminder"){
stock=await getSheet("商品庫存");
const latest=await getSheet("最新開團");
rows=rows.filter(i=>i.name&&i.status==="未訂購"&&!MAIN_GROUPS.includes(i.group)).map(i=>mergeStock(i,stock)).map(i=>mergeLatestPrice(i,latest));
rows=key==="latest"?rows.filter(i=>i.sn&&i.url):rows.filter(i=>!i.sn||!i.url);
}else rows=filterNormal(rows,key);

allItems=rows.map(i=>({...i,
category:key==="pending"?siteName(originOf(i.url)):(key==="latest"||key==="reminder")?(i.group||"其他"):(i.role||i.ip||i.group||"其他"),
type:i.type||"其他"
}));

allCategories=[...new Set(allItems.map(i=>i.category).filter(Boolean))];
allTypes=[...new Set(allItems.map(i=>i.type).filter(Boolean))];

renderRoleNav();
if(["pending","latest","reminder"].includes(key))document.getElementById("filter-bar").innerHTML="";
else renderFilters();

renderItems();
requestAnimationFrame(()=>document.getElementById("card-container").style.paddingTop=40+document.querySelector(".header-fixed").offsetHeight+"px");

}catch(e){
console.error(e);
document.getElementById("items-wrapper").innerHTML="<div style='padding:40px;color:#999'>載入失敗</div>";
}
}

function normalTab(){return["chiikawa","nagano","mogu"].includes(currentTab)}

function renderRoleNav(){
const cats=normalTab()?allCategories.filter(c=>!HIDE_ROLES.includes(c)):allCategories;
document.getElementById("dynamic-nav").innerHTML=cats.map(c=>`<a class="${selectedRole===c?"active-role":""}" onclick='toggleRole(${JSON.stringify(c)})'>${c}</a>`).join("");
}

function toggleRole(c){
selectedRole=selectedRole===c?null:c;
scrollTo({top:0,behavior:"smooth"});
renderRoleNav();renderItems();
}

function renderFilters(){
document.getElementById("filter-bar").innerHTML=allTypes.map(t=>`<label class="filter-item ${selectedTypes.includes(t)?"active":""}"><input type="checkbox" ${selectedTypes.includes(t)?"checked":""} onchange='toggleType(${JSON.stringify(t)})'>${t}</label>`).join("");
}

function toggleType(t){
selectedTypes=selectedTypes.includes(t)?selectedTypes.filter(x=>x!==t):[...selectedTypes,t];
renderFilters();renderItems();
}

function renderItems(){
const box=document.getElementById("items-wrapper");
box.innerHTML="";

let items=selectedTypes.length?allItems.filter(i=>selectedTypes.includes(i.type)):allItems;
if(selectedRole)items=items.filter(i=>i.category===selectedRole);

if(!items.length){
box.innerHTML="<div style='padding:40px;color:#999'>目前沒有符合的商品</div>";
return;
}

const remain={...orderedCounts};

const card=i=>{
const key=i.sn?`S:${norm(i.sn)}`:`N:${norm(i.name)}`;
let status="";

if((remain[key]||0)>0){
status="ordered";
remain[key]--;
}else if((soldOutCounts[key]||0)>0){
status="soldout";
}

return createCard(i,status);
};

const grid=a=>{
const g=document.createElement("div");
g.className="group-grid";
a.forEach(i=>g.appendChild(card(i)));
box.appendChild(g);
};

if(!selectedTypes.length&&!selectedRole){
const hidden=[];

allCategories.forEach(c=>{
const a=items.filter(i=>i.category===c);
if(!a.length)return;

if(normalTab()&&HIDE_ROLES.includes(c)){
hidden.push(...a);
return;
}

const d=document.createElement("div");
d.className="type-divider";
d.textContent=c;
box.appendChild(d);
grid(a);
});

if(hidden.length)grid(hidden);
}else grid(items);
}

function createCard(item,status=""){
const c=document.createElement("div"),buyer=buyerText(item),rem=currentTab==="reminder";
const miss=rem?`<div style="font-size:9px;color:#e66;margin-bottom:5px">${!item.sn&&!item.url?"缺貨號、商品網址":!item.sn?"缺貨號":"缺商品網址"}</div>`:"";
const warn=["chiikawa","nagano","mogu"].includes(currentTab)&&item.colStock==="1";
const link=item.url?`<a class="product-link" href="${item.url}" target="_blank" onclick="event.stopPropagation()">商品頁面</a>`:"";

c.className="card";
c.innerHTML=
`${status==="ordered"?'<div class="ordered-tag">✓</div>':""}
${status==="soldout"?'<div class="soldout-tag">❌</div>':""}
${warn?'<div class="stock-warning">⚠️</div>':""}
${(!rem||item.url)?'<div class="add-btn-tag">＋</div>':""}
<img src="${item.img||IMG}">
${buyer?`<div class="buyer" title="${buyer}">${buyer}</div>`:""}
<div class="name" title="${productText(item)}">${productText(item)}</div>
<div class="price">${priceText(item.originalPrice)}</div>
${link}${miss}`;

const btn=c.querySelector(".add-btn-tag");
if(btn)btn.onclick=e=>addToCart(e,rem?{...item,useUrl:true}:item);

c.onclick=()=>zoomCard(c);
return c;
}

function zoomCard(c){
const o=document.createElement("div");
o.className="card-overlay";
o.appendChild(c.cloneNode(true));
o.onclick=()=>o.remove();
document.body.appendChild(o);
}

function saveCart(){localStorage.setItem("jiwu_helper_cart",JSON.stringify(cart))}

function addToCart(e,item){
e.stopPropagation();
cart.push(item);saveCart();updateCartUI();
e.currentTarget.style.opacity=.4;
setTimeout(()=>e.currentTarget.style.opacity=1,120);
}

function removeFromCart(i){
cart.splice(i,1);saveCart();updateCartUI();
if(document.getElementById("checkout-modal").style.display==="flex")renderCheckoutSummary();
}

function clearCart(){
if(confirm("確定要清空購物車嗎？")){cart=[];saveCart();updateCartUI()}
}

function toggleCart(v){
document.getElementById("cart-panel").classList.toggle("open",v);
document.getElementById("cart-overlay-bg").style.display=v?"block":"none";
}

function cartInfo(){
const groups={};let total=0;
cart.forEach(i=>{
const o=originOf(i.url)||"未知官網",p=yen(i.originalPrice);
total+=p;
if(!groups[o])groups[o]={total:0,missing:0};
groups[o].total+=p;
if(!p)groups[o].missing++;
});
return{groups,total};
}

function shippingHtml(){
const {groups}=cartInfo();
if(!Object.keys(groups).length)return"尚未加入商品";
return Object.entries(groups).map(([o,g])=>{
const d=Math.max(0,FREE_SHIPPING-g.total),warn=g.missing?` <span style="color:#aaa">(${g.missing}件無原價)</span>`:"";
return `<div><b>${siteName(o)}</b>　¥${fmt(g.total)}<br>${d?`還差 <b>¥${fmt(d)}</b> 免運`:`<b>✓ 已達免運</b>`}${warn}</div>`;
}).join("<hr style='border:0;border-top:1px solid #eee'>");
}

function updateCartUI(){
document.getElementById("cart-list").innerHTML=cart.map((i,n)=>{
const b=buyerText(i);
return `<div class="cart-item"><img src="${i.img||IMG}"><div class="cart-item-info">${b?`<div style="color:#989FC0;font-weight:bold;white-space:nowrap">${b}</div>`:""}<div style="font-weight:bold;white-space:nowrap">${productText(i)}</div><div style="color:#F68450;font-weight:bold">${priceText(i.originalPrice)}</div></div><span style="cursor:pointer;color:#ccc;padding:5px" onclick="removeFromCart(${n})">✕</span></div>`;
}).join("");

const b=document.getElementById("cart-badge"),x=cartInfo();
b.textContent=cart.length;b.style.display=cart.length?"flex":"none";
document.getElementById("cart-total").textContent=`¥${fmt(x.total)}`;
document.getElementById("shipping-progress").innerHTML=shippingHtml();
}

function openCheckoutModal(){
if(!cart.length)return alert("購物車是空的唷！");
toggleCart(false);renderCheckoutSummary();
document.getElementById("checkout-modal").style.display="flex";
}

function closeModal(){document.getElementById("checkout-modal").style.display="none"}

function renderCheckoutSummary(){
document.getElementById("modal-summary-list").innerHTML=cart.map(i=>{
const b=buyerText(i);
return `<div class="cart-item"><img src="${i.img||IMG}"><div class="cart-item-info">${b?`<div style="color:#989FC0;font-weight:bold;white-space:nowrap">${b}</div>`:""}<div style="font-weight:bold;white-space:nowrap">${productText(i)}</div><div style="color:#F68450;font-weight:bold">${priceText(i.originalPrice)}</div></div></div>`;
}).join("");

document.getElementById("modal-total-price").textContent=`¥${fmt(cartInfo().total)}`;
document.getElementById("modal-shipping").innerHTML=shippingHtml();
}

async function getVariantInfo(item){
if(!item.url)throw new Error(`${item.name} 沒有商品網址`);

const u=new URL(item.url),m=u.pathname.match(/\/products\/([^/?#]+)/);
if(!m)throw new Error(`${item.name} 商品網址無法辨識`);

const r=await fetch(`${u.origin}/products/${m[1]}.js`);
if(!r.ok)throw new Error(`${item.name} 無法讀取商品資料`);

const p=await r.json();
let v;

if(item.useUrl||u.origin===SITES.mogu){
v=(p.variants||[]).find(x=>x.available!==false)||(p.variants||[])[0];
}else{
if(!item.sn)throw new Error(`${item.name} 沒有貨號`);
v=(p.variants||[]).find(x=>String(x.sku||"").trim()===String(item.sn).trim());
}

if(!v?.id)throw new Error(`${item.name} 找不到商品`);
return{id:String(v.id),available:v.available!==false};
}

async function makeCartData(origin,items){
const result=await Promise.all(items.map(async item=>({item,info:await getVariantInfo(item)})));
const ordered=result.filter(x=>x.info.available).map(x=>x.item);
const soldOut=result.filter(x=>!x.info.available).map(x=>x.item);
const qty={};

result.filter(x=>x.info.available).forEach(x=>qty[x.info.id]=(qty[x.info.id]||0)+1);

return{
ordered,soldOut,
url:ordered.length?`${origin}/cart/${Object.entries(qty).map(([id,n])=>`${id}:${n}`).join(",")}`:""
};
}

function recordOrderedList(ordered,soldOut){
const pack=a=>a.map(i=>({group:i.group||"",sn:String(i.sn||"").trim(),name:String(i.name||"").trim()}));
const body=JSON.stringify({action:"recordOrder",ordered:pack(ordered),soldOut:pack(soldOut)});
const blob=new Blob([body],{type:"text/plain;charset=utf-8"});

if(!navigator.sendBeacon||!navigator.sendBeacon(ORDER_API,blob))
fetch(ORDER_API,{method:"POST",body,keepalive:true,mode:"no-cors"}).catch(()=>{});
}

async function handleFinalCheckout(){
const btn=document.getElementById("send-btn");
btn.disabled=true;
btn.textContent="正在加入官網購物車...";

const opened={};

try{
if(cart.some(i=>!i.url||(!i.useUrl&&originOf(i.url)!==SITES.mogu&&!i.sn)))
throw new Error("有商品缺少加入購物車需要的資料");

const groups={};
cart.forEach(i=>{
const o=originOf(i.url);
if(!o)throw new Error(`${i.name} 商品網址錯誤`);
(groups[o]??=[]).push(i);
});

const origins=Object.keys(groups);

origins.slice(1).forEach(o=>{
const w=window.open("about:blank","_blank");
if(!w)throw new Error("瀏覽器阻擋新分頁，請允許此網站開啟彈出式視窗");
opened[o]=w;
});

const data={};
await Promise.all(origins.map(async o=>data[o]=await makeCartData(o,groups[o])));

const ordered=origins.flatMap(o=>data[o].ordered);
const soldOut=origins.flatMap(o=>data[o].soldOut);
const availableOrigins=origins.filter(o=>data[o].url);

recordOrderedList(ordered,soldOut);

if(!availableOrigins.length){
Object.values(opened).forEach(w=>{try{w.close()}catch{}});

soldOut.forEach(i=>{
const key=i.sn?`S:${norm(i.sn)}`:`N:${norm(i.name)}`;
soldOutCounts[key]=(soldOutCounts[key]||0)+1;
});

cart=[];saveCart();closeModal();updateCartUI();renderItems();
alert("購物車內商品目前都已缺貨，已記錄缺貨");
btn.disabled=false;
btn.textContent="確認訂購";
return;
}

const main=availableOrigins[0];

origins.slice(1).forEach(o=>{
if(o===main||!data[o].url){
try{opened[o]?.close()}catch{}
}else opened[o].location.href=data[o].url;
});

cart=[];saveCart();
location.href=data[main].url;

}catch(e){
Object.values(opened).forEach(w=>{try{w.close()}catch{}});
console.error(e);
alert(e.message);
btn.disabled=false;
btn.textContent="確認訂購";
}
}

(function(){
const el=document.getElementById("cart-trigger");
let drag=false,sx,sy,ix,iy;

function start(e){
drag=false;
const p=e.touches?e.touches[0]:e,r=el.getBoundingClientRect();
sx=p.clientX;sy=p.clientY;ix=r.left;iy=r.top;
document.addEventListener("mousemove",move);
document.addEventListener("touchmove",move,{passive:false});
document.addEventListener("mouseup",end);
document.addEventListener("touchend",end);
}

function move(e){
const p=e.touches?e.touches[0]:e,dx=p.clientX-sx,dy=p.clientY-sy;
if(Math.abs(dx)>5||Math.abs(dy)>5){
drag=true;
if(e.cancelable)e.preventDefault();
el.style.left=ix+dx+"px";el.style.top=iy+dy+"px";el.style.right="auto";
}
}

function end(){
document.removeEventListener("mousemove",move);
document.removeEventListener("touchmove",move);
document.removeEventListener("mouseup",end);
document.removeEventListener("touchend",end);

if(drag){
const r=el.getBoundingClientRect();
el.style.left=(r.left+r.width/2<innerWidth/2?10:innerWidth-r.width-10)+"px";
el.style.top=Math.max(50,Math.min(r.top,innerHeight-60))+"px";
}
}

el.onclick=e=>drag?e.preventDefault():toggleCart(true);
el.addEventListener("mousedown",start);
el.addEventListener("touchstart",start,{passive:false});
})();

window.onload=()=>{
renderTabs();
updateCartUI();
switchTab("pending");
};
</script>
</body>
